name: maratona do cerebro (codigo continua privado)

# PONTE COM BASTAO (07/09/2026): roda a bateria do repo PRIVADO ate o prazo
# TOTAL, em pernas de ate ~5h05 (teto da plataforma: 6h por rodada). No fim de
# cada perna, se ainda falta tempo, a rodada dispara a proxima SOZINHA com o
# GITHUB_TOKEN -- workflow_dispatch e a excecao que pode criar rodada nova.
# O codigo vive so na maquina descartavel; o log mostra APENAS contagens.

on:
  workflow_dispatch:
    inputs:
      fim_total:
        description: "hora de parar DE VEZ (segundos desde 1970, UTC)"
        required: true

permissions:
  actions: write

jobs:
  maratona_cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CEREBRO_TEST_TIMEOUT_MS: "120000"
      SYSTEMROOT: "/"
      TEMP: "/tmp"
      TMP: "/tmp"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedroigor2026/cerebro-criador-de-projetos
          ref: onda-portoes-0409
          token: ${{ secrets.CHAVE_DE_LEITURA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: preparo oficial - delegar o cgroup (jaula do Linux)
        # Diagnostico de 07/09 (run 34163653584): 117 dos 217 vermelhos eram
        # AMBIENTE e somem com este preparo. Sem ele o placar assusta a toa.
        run: |
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup 2>/dev/null || true
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null 2>&1 || true
      - name: pastas de estado que a maquina do GitHub nao traz
        run: mkdir -p "$HOME/.local/state" "$HOME/.local/share" "$HOME/.cache" "$HOME/.config"
      - name: bateria em volta ate o fim da perna (log so com contagens)
        shell: bash
        run: |
          FIMTOTAL="${{ inputs.fim_total }}"
          PERNA=$(( $(date -u +%s) + 305*60 ))
          FIM=$(( PERNA < FIMTOTAL ? PERNA : FIMTOTAL ))
          echo "perna ate $(date -u -d @$FIM +%H:%M:%S)Z; prazo total $(date -u -d @$FIMTOTAL +%H:%M:%S)Z"
          VOLTA=0; VERDES=0; VERMELHAS=0
          echo "| volta | comecou (UTC) | codigo de saida | veredito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while [ "$(date -u +%s)" -lt "$FIM" ]; do
            VOLTA=$((VOLTA + 1)); INICIO=$(date -u +%H:%M:%S)
            set +e; npm test > /tmp/saida.txt 2>&1; C=$?; set -e
            RESUMO=$(grep -aoE '(tests|pass|fail|skipped) [0-9]+' /tmp/saida.txt | tr '\n' ' ' | tail -c 120)
            if [ "$C" -eq 0 ]; then V="verde"; VERDES=$((VERDES+1)); else V="VERMELHA"; VERMELHAS=$((VERMELHAS+1)); fi
            echo "volta $VOLTA ($INICIO): saida=$C $V :: $RESUMO"
            echo "| $VOLTA | $INICIO | $C | $V |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$(date -u +%s)" -ge "$FIM" ]; then break; fi
            sleep 60
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$VOLTA voltas - $VERDES verdes - $VERMELHAS vermelhas**" >> "$GITHUB_STEP_SUMMARY"
          echo "$VOLTA voltas, $VERDES verdes, $VERMELHAS vermelhas."
          exit 0
      - name: passar o bastao se ainda falta tempo
        if: always()
        shell: bash
        run: |
          AGORA=$(date -u +%s)
          if [ "$AGORA" -lt "${{ inputs.fim_total }}" ]; then
            curl -sS -o /dev/null -w "bastao -> HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/cerebro-maratona.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"fim_total\":\"${{ inputs.fim_total }}\"}}"
          else
            echo "prazo total vencido: nao passo o bastao."
          fi
